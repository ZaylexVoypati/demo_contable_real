<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary-50:#fff9ec; --primary-100:#fff2d3; --primary-200:#ffe1a5; --primary-400:#ffa932;
    --primary-500:#ff8e0a; --primary-600:#ff7500; --primary-700:#cc5502; --primary-800:#a1410b;
    --gray-50:#F7FAFC; --gray-100:#EDF2F7; --gray-200:#E2E8F0; --gray-400:#A0AEC0; --gray-500:#718096; --gray-600:#4A5568; --gray-700:#2D3748;
    --green:#48BB78; --red:#E53E3E; --amber:#D69E2E; --blue:#63B3ED; --purple:#9F7AEA; --cyan:#4FD1C5; --pink:#F45774;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; background: var(--gray-50); color: var(--gray-600); font-size: 13px; }
  .layout { display: flex; min-height: 100vh; }

  /* ——— SIDEBAR ——— */
  .sidebar { width: 260px; flex: none; background: #fff; border-right: 1px solid var(--gray-100); height: 100vh; position: sticky; top: 0; overflow-y: auto; padding-bottom: 30px; }
  .sidebar .logo { display: flex; align-items: center; gap: 8px; padding: 18px 18px 14px; }
  .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--primary-600); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
  .logo-text { font-weight: 800; font-size: 20px; letter-spacing: .2px; }
  .logo-text b { color: #FC6232; font-weight: 800; }
  .logo-text i { color: #4D4D4D; font-style: normal; font-weight: 600; }
  .menu-group { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--gray-400); padding: 14px 20px 6px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 18px; margin: 1px 0; cursor: pointer; font-size: 13px; color: var(--gray-500); position: relative; transition: background .15s; border-left: 5px solid transparent; }
  .menu-item:hover { background: var(--gray-100); color: var(--gray-600); }
  .menu-item.active { background: var(--primary-50); color: var(--primary-600); font-weight: 600; border-left-color: var(--primary-600); }
  .menu-item .mi { width: 20px; text-align: center; font-size: 16px; }
  .menu-item .tag { margin-left: auto; font-size: 9px; background: var(--primary-100); color: var(--primary-700); padding: 1px 6px; border-radius: 999px; font-weight: 600; }

  /* ——— MAIN ——— */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 58px; background: #fff; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; gap: 14px; padding: 0 26px; position: sticky; top: 0; z-index: 20; }
  .topbar .t-title { font-size: 16px; font-weight: 700; color: var(--gray-700); }
  .topbar .t-sub { font-size: 11px; color: var(--gray-400); }
  .topbar .spacer { flex: 1; }
  .content { padding: 18px 26px 60px; max-width: 1280px; width: 100%; }

  /* ——— BOTONES ——— */
  .btn { font-family: inherit; font-size: 12.5px; font-weight: 600; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; background: var(--gray-100); color: var(--gray-600); white-space: nowrap; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .btn.primary { background: var(--primary-600); color: #fff; }
  .btn.primary:hover { background: var(--primary-700); }
  .btn.success { background: var(--green); color: #fff; }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.ghost { background: transparent; color: var(--primary-600); box-shadow: inset 0 0 0 1px var(--primary-200); }
  .btn.sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

  /* ——— CARDS ——— */
  .card { background: #fff; border: 1px solid var(--gray-100); border-radius: 4px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; color: var(--gray-700); margin-bottom: 2px; }
  .card .sub { font-size: 10px; color: var(--gray-500); margin-bottom: 12px; font-weight: 400; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border: 1px solid var(--gray-100); border-radius: 4px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .kpi .l { font-size: 11.5px; color: var(--gray-500); }
  .kpi .v { font-size: 22px; font-weight: 700; color: var(--gray-600); }
  .kpi .i { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-size: 16px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

  /* ——— TABLAS ——— */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--gray-400); padding: 8px 10px; border-bottom: 1px solid var(--gray-100); font-weight: 600; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
  tr:hover td { background: var(--gray-50); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .right { text-align: right; }

  .badge { display: inline-block; border-radius: 999px; padding: 2px 12px; line-height: 20px; font-size: 10.5px; font-weight: 600; }
  .badge.green { background: #C6F6D5; color: #276749; }
  .badge.red { background: #FED7D7; color: #9B2C2C; }
  .badge.amber { background: #FEEBC8; color: #975A16; }
  .badge.blue { background: #BEE3F8; color: #2C5282; }
  .badge.purple { background: #E9D8FD; color: #553C9A; }
  .badge.gray { background: var(--gray-200); color: var(--gray-600); }
  .badge.orange { background: var(--primary-100); color: var(--primary-800); }
  .badge.pink { background: #FED7E2; color: #97266D; }

  .ok { color: var(--green); font-weight: 700; }
  .ko { color: var(--red); font-weight: 700; }

  /* ——— BARRAS ——— */
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; }
  .bar-row .n { width: 180px; color: var(--gray-500); }
  .bar-row .t { flex: 1; background: var(--gray-50); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-row .f { height: 100%; border-radius: 6px; transition: width .6s ease; }
  .bar-row .a { width: 80px; text-align: right; font-variant-numeric: tabular-nums; }

  .log { background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: 4px; padding: 10px 12px; max-height: 300px; overflow: auto; font-size: 11.5px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .log div { padding: 2px 0; border-bottom: 1px dashed var(--gray-100); }
  .log .in { color: var(--green); } .log .out { color: var(--red); } .log .info { color: var(--gray-500); }

  .steps { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .step-pill { font-size: 10.5px; padding: 4px 10px; border-radius: 999px; background: var(--gray-100); color: var(--gray-400); font-weight: 600; }
  .step-pill.done { background: #C6F6D5; color: #276749; }
  .step-pill.active { background: var(--primary-500); color: #fff; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: #fdfdfd; }
  ::-webkit-scrollbar-thumb { background: #ebc088; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #ff8e0a; }

  .flash { animation: flash 1s ease; }
  @keyframes flash { 0% { background: var(--primary-100); } 100% { background: #fff; } }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--gray-700); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 99; opacity: 0; transform: translateY(10px); transition: all .3s; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text"><b>Voy</b><i>Pati</i></div>
    </div>
    <div class="menu-group">Operaciones</div>
    <div class="menu-item" data-view="dashboard"><span class="mi">🏠</span> Dashboard</div>

    <div class="menu-group">Finanzas</div>

    <div class="menu-item" data-view="billetera"><span class="mi">🏦</span> Billetera VoyPati</div>
    <div class="menu-item" data-view="facturas"><span class="mi">🧾</span> Facturas</div>
    <div class="menu-item" data-view="consolidado"><span class="mi">📊</span> Consolidado</div>

    <div class="menu-item" data-view="resumen"><span class="mi">📈</span> Resumen final</div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="t-title" id="pageTitle">Dashboard</div>

    <div class="content" id="content"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   MOTOR MULTI-ENTIDAD (puerto del demo_contable_real a navegador)
   ══════════════════════════════════════════════════════════════ */
const ACCOUNT_META = {
  voypati: { "1001":["Caja VoyPati (CUP)","asset"], "1002":["Caja VoyPati (USD)","asset"], "1200":["Comisiones por Cobrar","asset"], "2001":["Impuestos por Pagar","liability"], "3001":["Capital VoyPati","equity"], "4003":["Ingresos por Comisiones","revenue"], "4004":["Otros Ingresos","revenue"], "5003":["Gasto Marketing (Cupones)","expense"], "5004":["Comisiones de Promotores","expense"], "5005":["Gastos de Nómina","expense"], "5006":["Gastos Operativos","expense"], "5007":["Gastos por Impuestos","expense"], "5008":["Otros Gastos","expense"] },
  business: { "1001":["Caja del Negocio","asset"], "1100":["Cuentas por Cobrar","asset"], "1300":["Inventario","asset"], "3001":["Capital del Negocio","equity"], "4001":["Ingresos por Ventas","revenue"], "5001":["Costo de Mercancía (COGS)","expense"], "5008":["Otros Gastos","expense"] },
  driver: { "1001":["Billetera del Conductor","asset"], "4004":["Ingresos por Entregas","revenue"], "5008":["Gastos","expense"] },
  caja: { "1001":["Caja / Almacén","asset"], "4001":["Ingresos de Caja","revenue"], "5008":["Egresos de Caja","expense"] },
};
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
let seq = 1;
const id = () => "id" + seq++;
const nowISO = () => new Date().toISOString();

const world = { ledgers: {}, events: [], orderSeq: 0 };
function ledger(id) { if (!world.ledgers[id]) world.ledgers[id] = { type: id.split(":")[0], entries: [], accounts: {} }; return world.ledgers[id]; }
function post(entity, { date, ref, description, lines }) {
  const l = ledger(entity);
  const clean = lines.filter(x => (x.debit ?? 0) !== 0 || (x.credit ?? 0) !== 0).map(x => ({ account: x.account, debit: r2(x.debit ?? 0), credit: r2(x.credit ?? 0) }));
  const td = r2(clean.reduce((a, x) => a + x.debit, 0)), tc = r2(clean.reduce((a, x) => a + x.credit, 0));
  if (Math.abs(td - tc) > 0.001) throw new Error("Asiento desbalanceado: " + description);
  const e = { id: id(), date, ref, description, total: td, lines: clean };
  l.entries.push(e);
  clean.forEach(x => { const a = l.accounts[x.account] || (l.accounts[x.account] = { debit: 0, credit: 0, count: 0 }); a.debit = r2(a.debit + x.debit); a.credit = r2(a.credit + x.credit); a.count++; });
  return e;
}
function emit(type, entity, payload) { world.events.push({ id: id(), type, entity, payload, ts: nowISO() }); }
function balances(entity) {
  const l = ledger(entity); const meta = ACCOUNT_META[l.type]; const out = {};
  Object.entries(l.accounts).forEach(([code, a]) => {
    const m = meta[code] || [code, "asset"];
    const nat = m[1] === "asset" || m[1] === "expense" ? "debit" : "credit";
    out[code] = { code, name: m[0], type: m[1], debit: r2(a.debit), credit: r2(a.credit), natural_balance: r2(nat === "debit" ? a.debit - a.credit : a.credit - a.debit), count: a.count };
  });
  return out;
}
function trial(entity) { const b = balances(entity); const td = r2(Object.values(b).reduce((a, x) => a + x.debit, 0)), tc = r2(Object.values(b).reduce((a, x) => a + x.credit, 0)); return { balances: b, totalDebit: td, totalCredit: tc, balanced: Math.abs(td - tc) < 0.01, entries: ledger(entity).entries.length }; }
function pl(entity) { const b = balances(entity); const rev = Object.values(b).filter(x => x.type === "revenue"), exp = Object.values(b).filter(x => x.type === "expense"); const revenue = r2(rev.reduce((a, x) => a + x.natural_balance, 0)), expenses = r2(exp.reduce((a, x) => a + x.natural_balance, 0)); return { revenue, expenses, net_income: r2(revenue - expenses), rev, exp }; }
function cashFlow(entity) { const cup = [], usd = []; ledger(entity).entries.forEach(e => e.lines.forEach(l => { const arr = l.account === "1002" ? usd : (l.account === "1001" ? cup : null); if (arr) arr.push({ date: e.date, ref: e.ref, description: e.description, kind: l.debit > 0 ? "in" : "out", amount: l.debit > 0 ? l.debit : l.credit, currency: l.account === "1002" ? "USD" : "CUP" }); })); return { cup, usd }; }

/* ─── SERVICIOS ─── */
const PAYMENTS = ["payment_on_delivery", "wallet", "troypay", "qvapay"];
const BIZ = ["business:HUE1", "business:LMN", "business:CRN"];
const BIZ_NAME = { "business:HUE1": "Tienda Central", "business:LMN": "Minimercado La Esquina", "business:CRN": "Carnicería El Bodegón" };
const DRV = ["driver:D1", "driver:D2", "driver:D3"];
const PRODUCTS = [["Arroz 5kg",220,155],["Aceite 1L",90,64],["Detergente",65,46],["Café 250g",120,85],["Azúcar 1kg",55,38],["Leche en polvo",180,128]];

function createOrder(o) {
  const subtotal = r2(o.items.reduce((a, it) => a + it.price * it.quantity, 0));
  const discount = o.coupon ? r2(subtotal * o.coupon.discount_percentage / 100) : 0;
  const total_price = r2(subtotal - discount + o.fare);
  const investment = r2(o.items.reduce((a, it) => a + (it.cost ?? 0) * it.quantity, 0));
  const products_total = r2(subtotal - discount);
  return { id: id(), number: o.number, business: o.business, driver: o.driver, items: o.items, fare: r2(o.fare), subtotal, discount, total_price, products_total, investment, coupon: o.coupon, referral_code: o.referral_code, payment_method: o.payment_method, client_commission: r2(products_total * 0.1), messenger_profit: r2(o.fare * 0.9), status: "pending", is_paid: false, events: [{ status: "pending", note: "Creada" }] };
}
function payAtCashRegister(order, date) { post("caja:M1", { date, ref: "CASH-IN:" + order.number, description: "Pago de cliente " + order.number + " (" + order.payment_method + ")", lines: [{ account: "1001", debit: order.total_price }, { account: "4001", credit: order.total_price }] }); }
function deliverShipment(order, date) {
  const dp = r2(order.fare * 0.9), vc = r2(order.fare * 0.1);
  post(order.driver, { date, ref: "DRIVER:" + order.number, description: "Entrega " + order.number + " — profit conductor 90%", lines: [{ account: "1001", debit: dp }, { account: "4004", credit: dp }] });
  post("voypati", { date, ref: "COMM-EXP:" + order.number, description: "Comisión express 10% tarifa " + order.number, lines: [{ account: "1001", debit: vc }, { account: "4003", credit: vc }] });
  post("caja:M1", { date, ref: "PAY-DRV:" + order.number, description: "Pago a " + order.driver, lines: [{ account: "5008", debit: dp }, { account: "1001", credit: dp }] });
  post("caja:M1", { date, ref: "PAY-VPT:" + order.number, description: "Comisión express a VoyPati", lines: [{ account: "5008", debit: vc }, { account: "1001", credit: vc }] });
  emit("express.shipment.delivered", order.driver, { order: order.number, fare: order.fare, driverProfit: dp, voypatiCommission: vc });
}
function bookBusinessSale(order, date) {
  const net = r2(order.products_total - order.client_commission);
  post(order.business, { date, ref: "SALE:" + order.number, description: "Liquidación venta (neto " + net + ")", lines: [{ account: "1001", debit: net }, { account: "4001", credit: net }] });
  post(order.business, { date, ref: "COGS:" + order.number, description: "Costo de mercancía", lines: [{ account: "5001", debit: order.investment }, { account: "1300", credit: order.investment }] });
}
function runOrderJourney(order, date) {
  payAtCashRegister(order, date);
  deliverShipment(order, date);
  bookBusinessSale(order, date);
  post("voypati", { date, ref: "COMM-BIZ:" + order.number, description: "Comisión de negocio 10% " + order.number, lines: [{ account: "1001", debit: order.client_commission }, { account: "4003", credit: order.client_commission }] });
  const net = r2(order.products_total - order.client_commission);
  post("caja:M1", { date, ref: "PAY-BIZ:" + order.number, description: "Liquidación neta a " + order.business, lines: [{ account: "5008", debit: net }, { account: "1001", credit: net }] });
  post("caja:M1", { date, ref: "PAY-VPT-BIZ:" + order.number, description: "Comisión negocio a VoyPati", lines: [{ account: "5008", debit: order.client_commission }, { account: "1001", credit: order.client_commission }] });
  emit("orders.order.completed", "mercado", { order: order.number, total: order.total_price, referral: order.referral_code });
  if (order.referral_code) {
    const amount = r2(order.client_commission * 0.05);
    post("voypati", { date, ref: "PROMO:" + order.referral_code, description: "Comisión promotor (referido " + order.referral_code + ")", lines: [{ account: "5004", debit: amount }, { account: "1001", credit: amount }] });
    emit("core.referral.claimed", "core", { code: order.referral_code, amount });
  }
  order.status = "completed"; order.is_paid = true;
  order.events.push({ status: "completed", note: "Liquidada" });
}

/* ─── ESTADO DE LA DEMO ─── */
const state = { started: false, orders: [], phase: 0, opsDone: false, invoicesDone: false, withdrawDone: false };
const PHASES = ["Apertura", "Órdenes", "Gastos", "Facturas", "Retiros", "Cierre"];

function buildScenario() {
  const list = [];
  for (let i = 1; i <= 20; i++) {
    const p = PRODUCTS[(i * 7) % PRODUCTS.length];
    const qty = 1 + ((i * 3) % 3);
    const fare = 25 + ((i * 5) % 5) * 5;
    list.push(createOrder({
      number: "ORD-" + String(i).padStart(4, "0"),
      business: BIZ[i % 3],
      driver: DRV[(i + 1) % 3],
      items: [{ name: p[0], price: p[1], cost: p[2], quantity: qty }],
      fare,
      payment_method: PAYMENTS[i % 4],
      coupon: i % 6 === 0 ? { code: "VOY10", discount_percentage: 10 } : null,
      referral_code: i % 4 === 0 ? (i % 8 === 0 ? "REF-MARIA" : "REF-ALEX") : null,
    }));
  }
  return list;
}

/* ─── ACCIONES (botones) ─── */
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
function startDay() {
  if (state.started) return;
  state.started = true;
  post("voypati", { date: "2026-09-04T08:00", ref: "CAPITAL", description: "Capital de VoyPati", lines: [{ account: "1001", debit: 12000 }, { account: "3001", credit: 12000 }] });
  post("voypati", { date: "2026-09-04T08:00", ref: "CAPITAL-USD", description: "Capital VoyPati (USD)", lines: [{ account: "1002", debit: 500 }, { account: "3001", credit: 500 }] });

const fmt = n => (Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtI = n => (Math.round(n * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 0 });

const VIEWS = { dashboard: "Dashboard", ordenes: "Órdenes", caja: "Caja del Mercado", ingresos: "Ingresos", gastos: "Gastos", billetera: "Billetera VoyPati", facturas: "Facturas", consolidado: "Consolidado", negocios: "Negocios", conductores: "Conductores", conciliacion: "Conciliación", eventos: "Eventos", resumen: "Resumen final" };

function kpi(label, value, icon, color) {
  return `<div class="kpi"><div><div class="l">${label}</div><div class="v">${value}</div></div><div class="i" style="background:${color}">${icon}</div></div>`;
}
function consolidado() {
  const paid = state.orders.filter(o => o.is_paid);
  const sum = f => r2(paid.reduce((a, o) => a + f(o), 0));
  return { income_executed: sum(o => o.total_price), investment: sum(o => o.investment), shipping: sum(o => o.fare), messenger: sum(o => o.messenger_profit), commission: sum(o => o.client_commission), win: r2(sum(o => o.total_price) - sum(o => o.investment) + sum(o => o.fare) - sum(o => o.messenger_profit) - sum(o => o.client_commission)) };
}
function recalc() {
  const con = consolidado();
  const vp = pl("voypati"); const vCash = cashFlow("voypati");
  const vCup = vCash.cup.reduce((a, m) => a + (m.kind === "in" ? m.amount : -m.amount), 0);
  const bizNet = BIZ.reduce((a, b) => a + pl(b).net_income, 0);
  const drvWallet = DRV.reduce((a, d) => a + (balances(d)["1001"]?.natural_balance ?? 0), 0);
  const productsTotal = r2(state.orders.filter(o => o.is_paid).reduce((a, o) => a + o.products_total, 0));
  const fares90 = r2(state.orders.filter(o => o.is_paid).reduce((a, o) => a + r2(o.fare * 0.9), 0));
  const fares10 = r2(state.orders.filter(o => o.is_paid).reduce((a, o) => a + r2(o.fare * 0.1), 0));
  const bizSales = BIZ.reduce((a, b) => a + (balances(b)["4001"]?.natural_balance ?? 0), 0);
  const vpComm = balances("voypati")["4003"]?.natural_balance ?? 0;
  const cajaBal = balances("caja:M1")["1001"]?.natural_balance ?? 0;
  const opOut = state.opsDone ? 1260 : 0;
  const checks = [
    ["Negocios reciben el 90% de sus productos", r2(productsTotal * 0.9), bizSales],
    ["Conductores reciben el 90% de las tarifas", fares90, drvWallet],
    ["VoyPati cobra 10% productos + 10% tarifas", r2((state.orders.filter(o => o.is_paid).reduce((a, o) => a + o.client_commission, 0)) + fares10), vpComm],
    ["Caja del mercado cuadra (liquidación ± gastos)", r2(-opOut), cajaBal],
  ].map(c => ({ name: c[0], expected: c[1], actual: c[2], ok: Math.abs(c[1] - c[2]) < 0.5 }));
  return { con, vp, vCup, bizNet, drvWallet, checks, allOk: checks.every(c => c.ok), vpBal: balances("voypati"), bizSales, productsTotal, vpComm };
}

  const maxW = Math.max(r.con.income_executed, r.con.investment, r.con.shipping, r.con.messenger, r.con.commission, 1);

  document.getElementById("content").innerHTML = `
  <div class="kpi-grid">
    ${kpi("Saldo de caja", fmtI(bal) + " CUP", "🪙", bal < 0 ? "#EF4444" : "#10B981")}
    ${kpi("Ingresos de caja", fmtI(inc) + " CUP", "📥", "#3B82F6")}
    ${kpi("Egresos (liquidación)", fmtI(eg) + " CUP", "📤", "#EF4444")}
    ${kpi("Ganancia del mercado (win)", fmtI(r.con.win) + " CUP", "📈", "#10B981")}
  </div>
  <div class="grid2">
    <div class="card"><h3>Consolidado del mercado</h3><div class="sub">Fórmula real: ingreso − inversión + mensajería − profit mensajeros − comisión (getMetricsAll.ts:220)</div>
      ${bar("Ingreso ejecutado", "Ingreso ejecutado", r.con.income_executed, "#3B82F6")}
      ${bar("Inversión (costos)", "Inversión (costos)", r.con.investment, "#A0AEC0")}
      ${bar("Cobro mensajería", "Cobro mensajería", r.con.shipping, "#06B6D4")}
      ${bar("Profit mensajeros", "Profit mensajeros", r.con.messenger, "#F45774")}
      ${bar("Comisión VoyPati", "Comisión VoyPati", r.con.commission, "#F59E0B")}
      <div style="margin-top:10px;font-size:13px;font-weight:700;color:${r.con.win >= 0 ? "#276749" : "#9B2C2C"}">GANANCIA (win) = ${fmtI(r.con.win)} CUP</div>
    </div>
    <div class="card"><h3>Movimientos de la caja</h3><div class="sub">Hub de liquidación: cobra al cliente y liquida a negocio, conductor y VoyPati</div>
      <table><thead><tr><th>Ref</th><th>Descripción</th><th>Tipo</th><th class="num">Monto</th></tr></thead><tbody>
      ${cf.cup.map(m => `<tr><td>${m.ref}</td><td>${m.description}</td><td>${m.kind === "in" ? `<span class="badge green">Entrada</span>` : `<span class="badge red">Salida</span>`}</td><td class="num">${m.kind === "in" ? "+" : "−"}${fmt(m.amount)}</td></tr>`).join("") || "<tr><td colspan='4' class='info'>Sin movimientos</td></tr>"}
      </tbody></table>
    </div>
  </div>`;
}

function renderNegocios(r) {

  <div class="kpi-grid">
    ${kpi("Resultado neto de negocios", fmtI(r.bizNet) + " CUP", "🏪", "#F59E0B")}

function renderConductores(r) {
  const rows = DRV.map(d => { const bb = balances(d); return { id: d, wallet: bb["1001"]?.natural_balance ?? 0, earn: bb["4004"]?.natural_balance ?? 0 }; });
  const total = rows.reduce((a, x) => a + x.wallet, 0);
  const fares = r2(state.orders.filter(o => o.is_paid).reduce((a, o) => a + r2(o.fare * 0.9), 0));
  document.getElementById("content").innerHTML = `
  <div class="kpi-grid">
    ${kpi("Billeteras de conductores", fmtI(total) + " CUP", "🏍️", "#06B6D4")}
    ${kpi("Esperado (90% tarifas)", fmtI(fares) + " CUP", "🎯", "#F59E0B")}

  </div>
  <div class="card"><h3>DriverWallet — 90% de las tarifas</h3><div class="sub">vpt_express · cada entrega abona el 90% de la tarifa a su billetera</div>

    ${rows.map(x => `<tr><td><b>${x.id}</b></td><td class="num"><b>${fmt(x.wallet)} CUP</b></td><td class="num">${fmt(x.earn)} CUP</td><td><span class="badge orange">90%</span></td></tr>`).join("")}

  </div>`;
}

  <div class="kpi-grid">

    ${kpi("Negocios (neto)", fmtI(r.bizNet) + " CUP", "🏪", "#F59E0B")}

      <table><thead><tr><th>Entidad</th><th class="num">Monto</th></tr></thead><tbody>
      <tr><td>Mercado — ganancia (win)</td><td class="num">${fmtI(r.con.win)} CUP</td></tr>

      <tr style="font-weight:700;background:#fff9ec"><td>Conciliación cruzada</td><td class="num">${r.allOk ? "✔ CUADRA" : "✘ NO"}</td></tr>
      </tbody></table>
    </div>
  </div>`;
}

/* ─── NAVEGACIÓN ─── */
let currentView = "dashboard";
function setView(v) {
  currentView = v;
  document.querySelectorAll(".menu-item").forEach(m => m.classList.toggle("active", m.dataset.view === v));
  document.getElementById("pageTitle").textContent = VIEWS[v];
  render();
}
document.querySelectorAll(".menu-item").forEach(m => m.addEventListener("click", () => setView(m.dataset.view)));

function render() {
  const r = recalc();
  const views = {
    dashboard: renderDashboard, ordenes: renderOrdenes, caja: renderCaja, ingresos: renderIngresos,
    gastos: renderGastos, billetera: renderBilletera, facturas: renderFacturas, consolidado: renderCaja,
    negocios: renderNegocios, conductores: renderConductores, conciliacion: renderConciliacion,
    eventos: renderEventos, resumen: renderResumen,
  };
  (views[currentView] || renderDashboard)(r);
  setSteps();
}

/* init */
document.getElementById("pageTitle").textContent = "Dashboard";
setSteps();
render();
</script>
